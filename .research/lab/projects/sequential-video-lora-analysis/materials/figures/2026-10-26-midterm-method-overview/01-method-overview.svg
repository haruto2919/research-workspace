<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">画像モデルとの差分として、動画の動的情報を取り出す</title>
  <desc id="desc">ラベルなし動画の逐次入力、凍結した画像ViTとフレーム間LoRAによる分離候補、Delta Wに何が入ったかを確かめる対照実験を左から右へ示す研究手法の全体フロー図。</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#344054"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#D45C35"/>
    </marker>
    <style>
      .font { font-family: 'Noto Sans CJK JP', 'Yu Gothic', sans-serif; fill: #172033; }
      .title { font-size: 42px; font-weight: 800; letter-spacing: 0.4px; }
      .subtitle { font-size: 22px; font-weight: 500; fill: #475467; }
      .stage-no { font-size: 24px; font-weight: 800; fill: #FFFFFF; }
      .stage-title { font-size: 29px; font-weight: 800; }
      .stage-sub { font-size: 20px; font-weight: 500; fill: #667085; }
      .head { font-size: 25px; font-weight: 800; }
      .body { font-size: 23px; font-weight: 500; }
      .body-bold { font-size: 23px; font-weight: 800; }
      .small { font-size: 20px; font-weight: 500; fill: #475467; }
      .tiny { font-size: 18px; font-weight: 500; fill: #667085; }
      .accent { fill: #D45C35; }
      .accent-text { fill: #B23E1D; }
      .muted { fill: #667085; }
      .center { text-anchor: middle; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2.5; }
      .soft { fill: #F1F5F9; stroke: #94A3B8; stroke-width: 2; }
      .accent-card { fill: #FFF1EC; stroke: #D45C35; stroke-width: 2.5; }
      .aux-card { fill: #EAF3F3; stroke: #86A8A8; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#F8FAFC"/>

  <!-- Title -->
  <text x="64" y="68" class="font title">画像モデルとの差分として、動画の動的情報を取り出す</text>
  <text x="66" y="106" class="font subtitle">入力 → 分離のための提案構成 → ΔWの中身を対照実験で解析</text>
  <rect x="1618" y="46" width="238" height="50" rx="25" fill="#FFF1EC" stroke="#D45C35" stroke-width="2.5"/>
  <text x="1737" y="79" class="font body-bold accent-text center">提案構成（設計中）</text>

  <!-- Stage cards -->
  <rect x="48" y="142" width="340" height="844" rx="24" class="card"/>
  <rect x="414" y="142" width="830" height="844" rx="24" class="card"/>
  <rect x="1270" y="142" width="602" height="844" rx="24" class="card"/>

  <!-- Stage arrows -->
  <line x1="388" y1="525" x2="410" y2="525" stroke="#344054" stroke-width="5" marker-end="url(#arrow-dark)"/>
  <line x1="1244" y1="525" x2="1266" y2="525" stroke="#344054" stroke-width="5" marker-end="url(#arrow-dark)"/>

  <!-- Stage 1 header -->
  <circle cx="83" cy="181" r="22" fill="#667085"/>
  <text x="83" y="189" class="font stage-no center">1</text>
  <text x="119" y="183" class="font stage-title">入力</text>
  <text x="119" y="211" class="font stage-sub">ラベルなし動画を時間順に</text>
  <line x1="72" y1="231" x2="364" y2="231" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Video stream -->
  <text x="76" y="274" class="font head">動画ストリーム</text>
  <line x1="76" y1="397" x2="352" y2="397" stroke="#667085" stroke-width="3" marker-end="url(#arrow-dark)"/>
  <text x="354" y="426" class="font tiny" text-anchor="end">時間</text>

  <!-- Frame thumbnails -->
  <g>
    <rect x="70" y="296" width="59" height="78" rx="7" fill="#EAF3F3" stroke="#86A8A8" stroke-width="2"/>
    <circle cx="116" cy="312" r="6" fill="#86A8A8"/>
    <path d="M77 359 L92 337 L103 349 L114 329 L122 359 Z" fill="#B8D0D0"/>
    <rect x="136" y="296" width="59" height="78" rx="7" fill="#EAF3F3" stroke="#86A8A8" stroke-width="2"/>
    <circle cx="182" cy="312" r="6" fill="#86A8A8"/>
    <path d="M143 359 L158 337 L169 349 L180 329 L188 359 Z" fill="#B8D0D0"/>
    <rect x="202" y="296" width="59" height="78" rx="7" fill="#EAF3F3" stroke="#86A8A8" stroke-width="2"/>
    <circle cx="248" cy="312" r="6" fill="#86A8A8"/>
    <path d="M209 359 L224 337 L235 349 L246 329 L254 359 Z" fill="#B8D0D0"/>
    <rect x="268" y="296" width="59" height="78" rx="7" fill="#EAF3F3" stroke="#86A8A8" stroke-width="2"/>
    <circle cx="314" cy="312" r="6" fill="#86A8A8"/>
    <path d="M275 359 L290 337 L301 349 L312 329 L320 359 Z" fill="#B8D0D0"/>
  </g>

  <!-- Sliding windows -->
  <rect x="126" y="282" width="212" height="107" rx="12" fill="none" stroke="#D45C35" stroke-width="3" stroke-dasharray="8 7"/>
  <rect x="202" y="270" width="76" height="27" rx="13" fill="#D45C35"/>
  <text x="240" y="290" class="font tiny center" fill="#FFFFFF" style="fill:#FFFFFF;font-weight:800">T枚の窓</text>
  <path d="M112 459 C140 430, 216 430, 242 459" fill="none" stroke="#D45C35" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <path d="M178 510 C206 481, 282 481, 308 510" fill="none" stroke="#D45C35" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <rect x="78" y="462" width="202" height="53" rx="12" class="accent-card"/>
  <text x="179" y="496" class="font body-bold accent-text center">窓 1：f₁ … fₜ</text>
  <rect x="106" y="528" width="202" height="53" rx="12" class="accent-card"/>
  <text x="207" y="562" class="font body-bold accent-text center">窓 2：f₂ … fₜ₊₁</text>
  <text x="218" y="622" class="font small center">T枚ずつ順にモデルへ</text>

  <!-- Input notes -->
  <rect x="72" y="682" width="132" height="48" rx="24" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="138" y="714" class="font body-bold center">ラベル不要</text>
  <rect x="216" y="682" width="148" height="48" rx="24" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="290" y="714" class="font body-bold center">逐次入力</text>
  <rect x="72" y="758" width="292" height="126" rx="16" class="aux-card"/>
  <text x="218" y="817" class="font body-bold center">順序は入力時点で既知</text>
  <text x="218" y="857" class="font tiny center">窓内相対順序・人手ラベル不要</text>

  <!-- Stage 2 header -->
  <circle cx="451" cy="181" r="22" fill="#D45C35"/>
  <text x="451" y="189" class="font stage-no center">2</text>
  <text x="487" y="183" class="font stage-title">分離</text>
  <text x="487" y="211" class="font stage-sub">凍結した静的な基準 ＋ 動画で学ぶ差分</text>
  <line x1="438" y1="231" x2="1220" y2="231" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Central architecture -->
  <rect x="447" y="253" width="764" height="390" rx="20" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2.5"/>
  <rect x="474" y="273" width="710" height="86" rx="14" class="soft"/>
  <text x="500" y="307" class="font head">凍結した画像事前学習ViT　W₀</text>
  <text x="500" y="339" class="font small">静的情報の基準（1枚の画像だけで学習したモデル）</text>
  <!-- lock icon -->
  <rect x="1128" y="302" width="28" height="24" rx="4" fill="#667085"/>
  <path d="M1134 302 V292 C1134 278 1150 278 1150 292 V302" fill="none" stroke="#667085" stroke-width="5"/>
  <text x="1170" y="321" class="font small" text-anchor="end">凍結</text>

  <!-- Frame tokens and frozen spatial path -->
  <g>
    <rect x="500" y="392" width="126" height="67" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <text x="563" y="422" class="font body-bold center">frame t−2</text>
    <text x="563" y="449" class="font tiny center">tokens</text>
    <rect x="680" y="392" width="126" height="67" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <text x="743" y="422" class="font body-bold center">frame t−1</text>
    <text x="743" y="449" class="font tiny center">tokens</text>
    <rect x="860" y="392" width="126" height="67" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <text x="923" y="422" class="font body-bold center">frame t</text>
    <text x="923" y="449" class="font tiny center">tokens</text>
    <line x1="563" y1="460" x2="563" y2="502" stroke="#667085" stroke-width="3" marker-end="url(#arrow-dark)"/>
    <line x1="743" y1="460" x2="743" y2="502" stroke="#667085" stroke-width="3" marker-end="url(#arrow-dark)"/>
    <line x1="923" y1="460" x2="923" y2="502" stroke="#667085" stroke-width="3" marker-end="url(#arrow-dark)"/>
    <rect x="492" y="506" width="502" height="82" rx="14" class="soft"/>
    <text x="743" y="541" class="font body-bold center">共有・凍結した画像ViTの空間ブロック（W₀）</text>
    <text x="743" y="573" class="font small center">各フレームの静的な基準を維持</text>
  </g>

  <!-- Cross-frame LoRA overlay -->
  <path d="M563 392 C610 355, 696 355, 743 392" fill="none" stroke="#D45C35" stroke-width="4" marker-end="url(#arrow-accent)"/>
  <path d="M743 392 C790 355, 876 355, 923 392" fill="none" stroke="#D45C35" stroke-width="4" marker-end="url(#arrow-accent)"/>
  <rect x="494" y="365" width="498" height="50" rx="25" fill="#D45C35"/>
  <text x="743" y="398" class="font body-bold center" style="fill:#FFFFFF">LoRA ΔW：フレーム間 attention（Q / V）</text>

  <!-- Equation and optional tubelet -->
  <rect x="1018" y="388" width="160" height="67" rx="12" class="accent-card"/>
  <text x="1098" y="429" class="font body-bold accent-text center">W = W₀ + ΔW</text>
  <rect x="1018" y="481" width="160" height="79" rx="12" fill="#FFFFFF" stroke="#D45C35" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="1098" y="513" class="font small accent-text center">任意候補</text>
  <text x="1098" y="544" class="font small accent-text center">tubelet埋め込みLoRA</text>
  <text x="1098" y="606" class="font tiny center">ΔWだけを強調表示</text>

  <!-- Design principles -->
  <rect x="447" y="662" width="365" height="78" rx="14" class="aux-card"/>
  <text x="629" y="694" class="font body-bold center">学習するのはLoRAだけ</text>
  <text x="629" y="724" class="font small center">時間方向の学習moduleは置かない</text>
  <rect x="828" y="662" width="383" height="78" rx="14" class="aux-card"/>
  <text x="1019" y="694" class="font body-bold center">フレーム順はパラメータなし</text>
  <text x="1019" y="724" class="font small center">例：causal mask（未来を見ない）</text>

  <!-- Swappable training block -->
  <rect x="447" y="777" width="764" height="101" rx="16" fill="#FFFFFF" stroke="#667085" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="477" y="815" class="font body-bold">学習方法（差し替え可能）</text>
  <text x="477" y="852" class="font body">自己教師あり（例：対照学習）／教師あり　｜　詳細は別スライド</text>
  <path d="M447 827 L430 827 L430 390 L492 390" fill="none" stroke="#D45C35" stroke-width="3.5" stroke-dasharray="8 6" marker-end="url(#arrow-accent)"/>
  <rect x="456" y="746" width="188" height="32" rx="16" fill="#FFF1EC"/>
  <text x="550" y="769" class="font tiny accent-text center" style="font-weight:800">勾配はΔWだけへ</text>
  <line x1="1109" y1="575" x2="1137" y2="603" stroke="#667085" stroke-width="4"/>
  <line x1="1137" y1="575" x2="1109" y2="603" stroke="#667085" stroke-width="4"/>
  <text x="1088" y="633" class="font tiny center">W₀は更新しない</text>

  <!-- Scope note in center -->
  <rect x="447" y="907" width="764" height="50" rx="12" fill="#FFF7F4" stroke="#E6A58F" stroke-width="2"/>
  <text x="829" y="940" class="font body-bold accent-text center">狙い：学習法ではなく、ΔWを独立した解析対象として取り出す</text>

  <!-- Stage 3 header -->
  <circle cx="1307" cy="181" r="22" fill="#667085"/>
  <text x="1307" y="189" class="font stage-no center">3</text>
  <text x="1343" y="183" class="font stage-title">解析</text>
  <text x="1343" y="211" class="font stage-sub">ΔWに何が入ったかを検証する</text>
  <line x1="1294" y1="231" x2="1848" y2="231" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Same-structure comparison -->
  <text x="1300" y="273" class="font head">同じ構造のまま比較</text>
  <rect x="1300" y="294" width="226" height="132" rx="16" class="soft"/>
  <rect x="1320" y="318" width="186" height="47" rx="9" fill="#CBD5E1"/>
  <text x="1413" y="350" class="font body-bold center">画像ViT（W₀）</text>
  <rect x="1320" y="374" width="186" height="30" rx="8" fill="#E2E8F0"/>
  <text x="1413" y="396" class="font tiny center">Base：W₀のみ</text>

  <line x1="1538" y1="360" x2="1597" y2="360" stroke="#344054" stroke-width="4" marker-end="url(#arrow-dark)"/>
  <text x="1568" y="340" class="font tiny center">比較</text>

  <rect x="1608" y="294" width="226" height="132" rx="16" class="soft"/>
  <rect x="1628" y="318" width="186" height="47" rx="9" fill="#CBD5E1"/>
  <text x="1721" y="350" class="font body-bold center">画像ViT（W₀）</text>
  <rect x="1628" y="374" width="186" height="30" rx="8" fill="#D45C35"/>
  <text x="1721" y="396" class="font tiny center" style="fill:#FFFFFF;font-weight:800">＋ LoRA ΔW</text>
  <rect x="1373" y="444" width="390" height="54" rx="14" class="accent-card"/>
  <text x="1568" y="477" class="font body-bold accent-text center">比較上の差分 ＝ 動画から得た増分</text>
  <text x="1568" y="519" class="font tiny center">ただし、その中身が動的とはまだ限らない</text>
  <text x="1568" y="543" class="font tiny center">補助対照：L0（順序不変）／L1（時間module側に学習）</text>

  <!-- Hypotheses -->
  <text x="1300" y="573" class="font head">検証する仮説</text>
  <text x="1838" y="573" class="font tiny" text-anchor="end">「はず」を対照実験で確かめる</text>

  <rect x="1300" y="585" width="538" height="92" rx="15" fill="#FFFFFF" stroke="#D45C35" stroke-width="2.5"/>
  <circle cx="1336" cy="631" r="22" fill="#FFF1EC" stroke="#D45C35" stroke-width="2"/>
  <text x="1336" y="639" class="font body-bold accent-text center">A</text>
  <text x="1372" y="619" class="font body-bold">時間を変える</text>
  <text x="1372" y="654" class="font body">並べ替え・逆再生 → ΔWの寄与は反応するはず</text>

  <rect x="1300" y="692" width="538" height="92" rx="15" fill="#FFFFFF" stroke="#D45C35" stroke-width="2.5"/>
  <circle cx="1336" cy="738" r="22" fill="#FFF1EC" stroke="#D45C35" stroke-width="2"/>
  <text x="1336" y="746" class="font body-bold accent-text center">B</text>
  <text x="1372" y="726" class="font body-bold">見た目を変える</text>
  <text x="1372" y="761" class="font body">背景・色 → ΔWの寄与は変わらないはず</text>

  <rect x="1300" y="799" width="538" height="92" rx="15" fill="#FFFFFF" stroke="#D45C35" stroke-width="2.5"/>
  <circle cx="1336" cy="845" r="22" fill="#FFF1EC" stroke="#D45C35" stroke-width="2"/>
  <text x="1336" y="853" class="font body-bold accent-text center">C</text>
  <text x="1372" y="833" class="font body-bold">ΔWそのものを調べる</text>
  <text x="1372" y="868" class="font body">外す・強さを変える・特異値を解析する</text>

  <!-- Caution and future use -->
  <rect x="1300" y="902" width="538" height="55" rx="13" fill="#FFF7F4" stroke="#E6A58F" stroke-width="2"/>
  <text x="1569" y="927" class="font small accent-text center" style="font-weight:800">ΔWに静的な動画ドメイン差分も混ざりうる</text>
  <text x="1569" y="951" class="font tiny center">「きれいな分離」は仮定せず、分離の成否を検証</text>

  <!-- Footer -->
  <text x="64" y="1030" class="font tiny">Source: Project README / Brainstorm notes (2026-10-26 13:55・14:25・15:10 JST)</text>
  <text x="1856" y="1030" class="font tiny" text-anchor="end">将来の活用：動作認識　｜　動画生成　｜　動画×言語</text>
</svg>
